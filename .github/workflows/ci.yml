name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  smoke:
    name: API smoke test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: bun install --frozen-lockfile
      - name: Reset local D1 and apply seed
        run: |
          bunx wrangler d1 execute starisle --local --file=src/db/schema.sql
          bunx wrangler d1 execute starisle --local --file=src/db/seed.sql
      - name: Start worker and smoke test endpoints
        run: |
          bunx wrangler dev --port 8787 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8787/api/stats && break || sleep 2
          done
          curl -sf http://localhost:8787/ | grep -q "星屿"
          curl -sf http://localhost:8787/api/projects | grep -q "projects"
          curl -sf http://localhost:8787/api/courses | grep -q "courses"
          curl -sf http://localhost:8787/api/members | grep -q "members"
          curl -sf http://localhost:8787/api/mentors | grep -q "mentors"
          curl -sf http://localhost:8787/api/columns | grep -q "columns"
          TOKEN=$(curl -sf -X POST http://localhost:8787/api/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email_otp":"000000","username":"ci-smoke-test,"password":"ci-password-123","display_name":"CI","email":"ci@example.com","statement":"automated smoke test application","age":16,"consent_privacy":true,"consent_public":true}' | python3 -c "import json,sys;print(json.load(sys.stdin)['token'])")
          curl -sf -X POST http://localhost:8787/api/auth/application/status \
            -H 'Content-Type: application/json' \
            -d '{"email_otp":"000000","username":"ci-smoke-test,"password":"ci-password-123"}' | grep -q pending
          echo "smoke test passed, receipt: $TOKEN"

  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: [typecheck, build, smoke]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: bun install --frozen-lockfile
      - name: Apply D1 schema (idempotent)
        run: bunx wrangler d1 execute starisle --remote --file=src/db/schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy worker
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test production
        run: |
          for i in $(seq 1 15); do
            curl -sf https://starisle.qingquanshi65.workers.dev/api/stats && break || sleep 3
          done
          curl -sf https://starisle.qingquanshi65.workers.dev/ | grep -q "星屿"
          echo "production OK"
