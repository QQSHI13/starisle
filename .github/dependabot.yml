version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    versioning-strategy: "increase"
    labels:
      - "dependencies"
    groups:
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
      wrangler:
        patterns:
          - "wrangler"
          - "@cloudflare/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
